<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service — RAE ESSENCE LUXE</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="site-header__logo">RAE ESSENCE <span>LUXE</span></a>
      <nav class="nav">
        <button type="button" class="nav__toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
        <ul class="nav__list">
          <li><a href="shop.html" class="nav__link">Shop</a></li>
          <li><a href="services.html" class="nav__link">Services</a></li>
          <li><a href="about.html" class="nav__link">About</a></li>
          <li><a href="contact.html" class="nav__link">Contact</a></li>
          <li><a href="faq.html" class="nav__link">FAQ</a></li>
          <li><a href="cart.html" class="nav__link nav__cart">Cart <span class="nav__cart-count" hidden>0</span></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="alertContainer"></div>
    <div id="serviceDetail"></div>

    <section id="bookingSection" class="booking-form" hidden style="margin-bottom: var(--space-2xl);">
      <h2>Book This Service</h2>
      <div id="bookingAlert"></div>
      <form id="bookingForm" class="form" novalidate>
        <div class="form__group">
          <label class="form__label" for="bookingName">Full name</label>
          <input class="form__input" type="text" id="bookingName" required>
        </div>
        <div class="form__group">
          <label class="form__label" for="bookingEmail">Email</label>
          <input class="form__input" type="email" id="bookingEmail" required>
        </div>
        <div class="form__group">
          <label class="form__label" for="bookingPhone">Phone number</label>
          <input class="form__input" type="tel" id="bookingPhone" required>
        </div>
        <div class="form__group">
          <label class="form__label" for="bookingDate">Preferred date</label>
          <input class="form__input" type="date" id="bookingDate" required>
        </div>
        <div class="form__group">
          <label class="form__label" for="bookingNotes">Notes (optional)</label>
          <textarea class="form__textarea" id="bookingNotes" rows="3" placeholder="Hair length, style reference, or anything else we should know"></textarea>
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="bookingButton">Request Booking</button>
        <p class="form__hint">We'll contact you to confirm your appointment time and arrange payment.</p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>&copy; 2026 RAE ESSENCE LUXE. All rights reserved.</p>
      <div class="site-footer__links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
        <a href="https://www.tiktok.com/@rae_essence_hair" target="_blank" rel="noopener">TikTok</a>
        <a href="https://www.instagram.com/hairby_raeessence" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
  </footer>

  <script src="js/data-helpers.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/service-detail.js"></script>
</body>
</html>
