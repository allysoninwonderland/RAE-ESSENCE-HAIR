<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — RAE ESSENCE HAIR</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-login">
    <div class="admin-login__card">
      <h1 class="admin-login__title">RAE ESSENCE HAIR Admin</h1>
      <div id="alertContainer"></div>
      <form id="loginForm" class="form" novalidate>
        <div class="form__group">
          <label class="form__label" for="username">Username</label>
          <input class="form__input" type="text" id="username" required autocomplete="username">
        </div>
        <div class="form__group">
          <label class="form__label" for="password">Password</label>
          <input class="form__input" type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn--primary btn--block">Log In</button>
      </form>
    </div>
  </div>

  <script src="../js/data-helpers.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
